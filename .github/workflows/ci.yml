name: CI

# デプロイそのものは Cloudflare Pages の Git 連携が行う。
# ここで見るのは「main に入る前に 2 サイトともビルドが通るか」だけ。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Cloudflare Pages が流すのと同じコマンド。
      # 出力先が変わっていないかもここで気づける
      - name: Build (profile)
        run: npm run build:profile

      - name: Build (blog)
        run: npm run build:blog

      - name: Check build output
        run: |
          test -f apps/profile/out/index.html || { echo "❌ profile の index.html が無い"; exit 1; }
          test -f apps/blog/out/index.html || { echo "❌ blog の index.html が無い"; exit 1; }
          echo "✅ 2 サイトとも静的出力が生成された"

  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'

      # backend を初期化すると認証情報が要るので、書式と妥当性だけ見る
      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -diff

      - name: Terraform validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
